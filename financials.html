<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MOFFL • Financials</title><link rel="stylesheet" href="assets/style.css"></head><body><div id="nav"></div><main class="shell"><div class="pagehead"><div class="eyebrow">Follow the money</div><h1>Financials & ROI</h1><p style="color:var(--muted)">Current normalized financial leaderboard; historical classification remains auditable in the database.</p></div><div class="card tablewrap"><table class="table"><thead><tr><th>ROI Rank</th><th>GM</th><th>Paid In</th><th>Winnings</th><th>Net</th><th>ROI</th></tr></thead><tbody id="rows"></tbody></table></div></main><div id="footer"></div><script src="assets/app.js"></script><script>(async()=>{let d=await get("financial_leaderboard");$("#rows").innerHTML=d.sort((a,b)=>Number(a.ROI_Rank)-Number(b.ROI_Rank)).map(g=>`<tr><td class="rank">#${g.ROI_Rank}</td><td><b>${g.GM_Name}</b></td><td>${money(g.Total_Paid_In)}</td><td>${money(g.Total_Winnings)}</td><td>${money(g.Net_Profit_Loss)}</td><td>${pct(g.ROI)}</td></tr>`).join("")})();</script></body></html>
