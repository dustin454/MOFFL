<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MOFFL • Draft Archive</title><link rel="stylesheet" href="assets/style.css"></head><body><div id="nav"></div><main class="shell"><div class="pagehead"><div class="eyebrow">The war room</div><h1>Draft Archive</h1><p style="color:var(--muted)">Explicit historical player selections. Traded-pick ownership remains conservatively represented from the source boards.</p></div><div class="filters"><select id="season"></select><input id="q" class="input" placeholder="Search player or GM…"></div><div class="card tablewrap"><table class="table"><thead><tr><th>Rnd</th><th>Slot</th><th>GM</th><th>Player</th><th>Pos</th><th>NFL</th></tr></thead><tbody id="rows"></tbody></table></div></main><div id="footer"></div><script src="assets/app.js"></script><script>
(async()=>{let d=await get("draft_picks"), seasons=[...new Set(d.map(x=>x.Season))].sort((a,b)=>b-a);$("#season").innerHTML=seasons.map(y=>`<option>${y}</option>`).join("");function draw(){let y=+$("#season").value,q=$("#q").value.toLowerCase();$("#rows").innerHTML=d.filter(x=>x.Season==y&&(`${x.Player_Name} ${x.Board_GM_Name}`).toLowerCase().includes(q)).map(x=>`<tr><td class="rank">${x.Round}</td><td>${x.Board_Slot}</td><td>${x.Board_GM_Name||"—"}</td><td><b>${x.Player_Name}</b></td><td>${x.Position||"—"}</td><td>${x.NFL_Team||"—"}</td></tr>`).join("")}$("#season").onchange=draw;$("#q").oninput=draw;draw()})();</script></body></html>
